<!doctype html>
<html><head><meta charset="utf-8"><title>Cards contact sheet</title>
<style>
  body { background:#1f3d2e; color:#f4e8d0; font-family:Georgia,serif; margin:0; padding:24px; }
  h1 { margin:0 0 16px; font-weight:400; letter-spacing:0.2em; }
  .grid { display:grid; grid-template-columns:repeat(8, 1fr); gap:12px; max-width:1200px; }
  .card { background:transparent; }
  .card img { display:block; width:100%; height:auto; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,0.4); }
  .card .lbl { text-align:center; font-size:11px; margin-top:4px; opacity:0.75; }
  .row-label { grid-column:1/-1; font-size:13px; opacity:0.7; padding-top:12px; letter-spacing:0.1em; }
  .back-row { display:flex; gap:12px; margin-top:32px; }
  .back-row img { width:140px; }
</style></head>
<body>
  <h1>COINCHE — Card deck (32 + back)</h1>
  <div class="grid" id="g"></div>
  <div class="back-row">
    <div><img src="back.svg"><div class="lbl">back</div></div>
  </div>
<script>
  const ranks = ['7','8','9','10','V','D','R','A'];
  const suits = ['coeur','carreau','trefle','pique'];
  const g = document.getElementById('g');
  for (const s of suits) {
    g.insertAdjacentHTML('beforeend', `<div class="row-label">${s.toUpperCase()}</div>`);
    for (const r of ranks) {
      g.insertAdjacentHTML('beforeend', `<div class="card"><img src="${r}-${s}.png"><div class="lbl">${r} ${s.charAt(0).toUpperCase()}</div></div>`);
    }
  }
</script>
</body></html>
